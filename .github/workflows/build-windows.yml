name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Windows executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan CloudFlareScan

      - name: Move EXE to repository root
        run: |
          Copy-Item -Path dist\CloudFlareScan.exe -Destination CloudFlareScan.exe -Force

      - name: Commit and push EXE
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CloudFlareScan.exe
          git diff --cached --quiet || git commit -m "ci: update Windows executable [skip ci]"
          git pull --rebase
          git push
