name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Windows executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-Windows CloudFlareScan

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/CloudFlareScan-Windows.exe

  build-macos:
    # macos-14 is Apple Silicon (M1, arm64)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build macOS app
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-macOS CloudFlareScan

      - name: Package macOS app
        run: |
          cd dist
          zip -r CloudFlareScan-macOS-arm64.zip CloudFlareScan-macOS.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/CloudFlareScan-macOS-arm64.zip

  build-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Ubuntu executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-Linux CloudFlareScan

      - name: Package Ubuntu executable
        run: |
          cd dist
          zip CloudFlareScan-Ubuntu-x86_64.zip CloudFlareScan-Linux

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-bin
          path: dist/CloudFlareScan-Ubuntu-x86_64.zip

  release:
    needs: [ build-windows, build-macos, build-ubuntu ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The concurrency group above ensures only one run of this workflow
          # executes at a time, so delete-then-recreate is race-free.
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          gh release create latest \
            --title "Latest Build" \
            --notes "Automatically built from commit \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest \
            "artifacts/windows-exe/CloudFlareScan-Windows.exe#CloudFlareScan-Windows.exe" \
            "artifacts/macos-app/CloudFlareScan-macOS-arm64.zip#CloudFlareScan-macOS-arm64.zip" \
            "artifacts/ubuntu-bin/CloudFlareScan-Ubuntu-x86_64.zip#CloudFlareScan-Ubuntu-x86_64.zip"
