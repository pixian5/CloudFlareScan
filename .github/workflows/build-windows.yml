name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-windows-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Windows executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan CloudFlareScan

      - name: Move EXE to repository root
        run: |
          Copy-Item -Path dist\CloudFlareScan.exe -Destination CloudFlareScan.exe -Force

      - name: Commit and push EXE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CloudFlareScan.exe
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: update Windows executable [skip ci]"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              pushed=true
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Push attempt $i failed, retrying..."
              sleep 10
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "All push attempts failed"
            exit 1
          fi
