name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Windows executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-Windows CloudFlareScan

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/CloudFlareScan-Windows.exe

  build-macos:
    # macos-14 is Apple Silicon (M1, arm64)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build macOS app
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-macOS CloudFlareScan

      - name: Package macOS app
        run: |
          cd dist
          zip -0 -r CloudFlareScan-macOS-arm64.zip CloudFlareScan-macOS.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/CloudFlareScan-macOS-arm64.zip

  build-macos-intel:
    # macos-14 is Apple Silicon; use Rosetta 2 (arch -x86_64) to cross-build for Intel (x86_64)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (x86_64 via Rosetta 2)
        shell: arch -x86_64 /bin/bash -l {0}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-x86"
          "$RUNNER_TEMP/venv-x86/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv-x86/bin/pip" install pyinstaller aiohttp PySide6

      - name: Build macOS Intel app
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        shell: arch -x86_64 /bin/bash -l {0}
        run: |
          "$RUNNER_TEMP/venv-x86/bin/pyinstaller" --onefile --windowed --name CloudFlareScan-macOS CloudFlareScan

      - name: Package macOS Intel app
        run: |
          cd dist
          zip -0 -r CloudFlareScan-macOS-x86_64.zip CloudFlareScan-macOS.app

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-app
          path: dist/CloudFlareScan-macOS-x86_64.zip

  build-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp PySide6

      - name: Build Ubuntu executable
        # Input file 'CloudFlareScan' has no .py extension — this is intentional
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan-Linux CloudFlareScan

      - name: Package Ubuntu executable
        run: |
          cd dist
          zip -0 CloudFlareScan-Ubuntu-x86_64.zip CloudFlareScan-Linux

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-bin
          path: dist/CloudFlareScan-Ubuntu-x86_64.zip

  release:
    needs: [ build-windows, build-macos, build-macos-intel, build-ubuntu ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compute next version (X.Y.Z, carry at 10) from the latest versioned release tag.
          LATEST_TAG=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tagName | ltrimstr("v") | split(".") | map(tonumber)) | last | .tagName // ""')
          if [ -z "$LATEST_TAG" ]; then
            NEXT="v0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            PATCH=$((PATCH + 1))
            if [ $PATCH -ge 10 ]; then PATCH=0; MINOR=$((MINOR + 1)); fi
            if [ $MINOR -ge 10 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); fi
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "Publishing version: $NEXT"

          gh release create "$NEXT" \
            --title "$NEXT" \
            --notes "Version $NEXT — built from commit \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest \
            "artifacts/windows-exe/CloudFlareScan-Windows.exe#CloudFlareScan-Windows.exe" \
            "artifacts/macos-app/CloudFlareScan-macOS-arm64.zip#CloudFlareScan-macOS-arm64.zip" \
            "artifacts/macos-intel-app/CloudFlareScan-macOS-x86_64.zip#CloudFlareScan-macOS-x86_64.zip" \
            "artifacts/ubuntu-bin/CloudFlareScan-Ubuntu-x86_64.zip#CloudFlareScan-Ubuntu-x86_64.zip"
